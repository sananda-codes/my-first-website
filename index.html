<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff9a9e,#fecfef,#ffdde1);font-family:Arial;overflow:hidden;text-align:center}
.card{background:white;padding:30px;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.2);max-width:320px;z-index:2}
h1{color:#ff4d6d;font-size:24px}
p{color:#555}
img{width:180px;border-radius:15px}
button{padding:12px 25px;font-size:18px;border:none;border-radius:20px;cursor:pointer;margin:10px}
#yesBtn{background:#ff4d6d;color:white}
#noBtn{background:#ddd;position:absolute}
.heart{position:absolute;font-size:24px;animation:float 3s infinite}
@keyframes float{0%{transform:translateY(100vh)}100%{transform:translateY(-100px)}}
</style>
</head>
<body>
<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:30%;animation-delay:1s">💖</div>
<div class="heart" style="left:60%;animation-delay:0.5s">❤️</div>
<div class="heart" style="left:85%;animation-delay:1.5s">💕</div>

<div class="card" id="main">
<img src="https://media.tenor.com/iv8x1QyQSSQAAAAM/cute-cat.gif">
<h1>Will you go on a date with me? 🥺❤️</h1>
<p>Please bol na YES... 🥹</p>
<button id="yesBtn" onclick="yesClick()">YES 😍</button>
<button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">NO 🙄</button>
</div>

<script>
function moveNo(){
  var btn=document.getElementById('noBtn');
  var x=Math.random()* (window.innerWidth-100);
  var y=Math.random()* (window.innerHeight-50);
  btn.style.left=x+'px';
  btn.style.top=y+'px';
}
function yesClick(){
  document.getElementById('main').innerHTML='<img src="https://media.tenor.com/7qP5m2kK8JkAAAAM/hug.gif"><h1>YAYYY! I Knew It! 🥰❤️</h1><p>Best decision ever! Date fixed! 💌<br>Love youuu!</p>';
}
</script>
</body>
</html>
