<!DOCTYPE html>
<html>
<head>
  <title>My Mood Diary</title>
</head>
<body style="text-align:center; font-family: Arial; background-color: #FFF0F5;">

  <h1>Hi, I am Sananda</h1>
  <p>How is my mood today? Click a button!</p>

  <button onclick="showMood('happy')">Happy</button>
  <button onclick="showMood('sad')">Sad</button>
  <button onclick="showMood('bored')">Bored</button>
  <button onclick="showMood('excited')">Excited</button>

  <h2 id="message"></h2>

  <script>
    function showMood(mood) {
      let text = "";
      if (mood == 'happy') {
        text = "Today I am very happy! Everything feels good!";
      }
      else if (mood == 'sad') {
        text = "Today I feel a little sad. I need some rest.";
      }
      else if (mood == 'bored') {
        text = "I am feeling bored... Let's make something new!";
      }
      else if (mood == 'excited') {
        text = "Today I am super excited! Something new will happen!";
      }
      document.getElementById("message").innerText = text;
    }
  </script>

</body>
</html>
